# .github/workflows/ci.yml
#
# HARDENING (item 5) -- make CI actually run on pull requests.
#
# WHAT WAS WRONG
# --------------
# The pipeline existed and could not pass:
#
#   1. `npm run lint` runs `next lint`, which currently exits 1 with 23
#      pre-existing errors. It sat BEFORE the test steps, so the job died
#      there and type-check/tests never ran at all. A green-looking
#      pipeline that has never executed a test is worse than no pipeline,
#      because it is mistaken for coverage.
#
#   2. `pull_request` was scoped to `branches: [main]`, so a PR into
#      `develop` -- where most work lands -- ran nothing.
#
#   3. It ran `test:unit` rather than `npm test`, so any suite outside
#      tests/security and tests/unit was never executed on CI.
#
# WHAT CHANGED
# ------------
# * PRs to main AND develop.
# * npm ci -> type-check -> npm test -> test:security, in that order, all
#   blocking.
# * Lint retained but NON-BLOCKING (`continue-on-error`), so its output
#   stays visible without gating the pipeline on 23 pre-existing errors.
#   Fixing those means touching unrelated business logic, which this work
#   deliberately does not do -- see HARDENING_REMAINING.md.
# * Integration tests run in their own job, allowed to fail, because they
#   need a mongodb-memory-server binary download that is not available in
#   every environment (see the job's own comment).
#
# NO SECRET VALUES ARE HARDCODED. Everything sensitive comes from
# `secrets.*`, and the unit/security suites deliberately need none: they
# are pure and structural, so a fork PR with no secrets access still gets
# a real signal.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # `npm ci` rather than `npm install`: it fails on a lockfile that
      # has drifted from package.json, which is the condition that kept
      # this pipeline from running at all before Phase 0.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Non-blocking: 23 pre-existing errors, and `next lint` is
      # deprecated in Next 15. Visible in the log, does not gate merges.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm test

      # A separately-named signal for the security suites. They are a
      # subset of `npm test` above, so this cannot fail on its own -- it
      # exists so a reviewer can see "security: passed" without reading
      # the full test log.
      - name: Security suites
        run: npm run test:security

      - name: Performance smoke tests
        run: npm run test:performance

  integration:
    name: Integration tests (real MongoDB)
    runs-on: ubuntu-latest
    # ALLOWED TO FAIL, deliberately. These use mongodb-memory-server,
    # which downloads a MongoDB binary from fastdl.mongodb.org on first
    # run. That download is unavailable in some networks (corporate
    # proxies, air-gapped runners, and the environment these tests were
    # authored in), and the suites skip themselves rather than fail when
    # the binary cannot be obtained.
    #
    # Not folded into `verify` because a network-dependent step must
    # never be able to block a merge on an infrastructure hiccup -- and
    # not deleted, because when the binary IS available these are the
    # only tests in the repository that exercise real index behaviour.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cached so a runner does not re-download the binary on every job.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Integration tests
        run: npm run test:integration
        env:
          # Makes the suites FAIL rather than skip when the binary is
          # missing, so a silent skip cannot masquerade as coverage on a
          # runner that is supposed to have it.
          REQUIRE_INTEGRATION_DB: 'true'

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
